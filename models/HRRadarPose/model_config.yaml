group: 1
num_joints: 17
layer1_block: ResNetBlock

stage2_inplanes: 8
stage2_num_modules: 1
stage2_num_branches: 2
stage2_block: ResNetBlock
stage2_num_blocks: [1, 1]
stage2_num_channels: [8, 8]
stage2_fuse_method: SUM

stage3_num_modules: 1
stage3_num_branches: 3
stage3_block: ResNetBlock
stage3_num_blocks: [1, 1, 1]
stage3_num_channels: [8, 8, 8]
stage3_fuse_method: SUM

stage4_num_modules: 1
stage4_num_branches: 4
stage4_block: ResNetBlock
stage4_num_blocks: [1, 1, 1, 1]
stage4_num_channels: [8, 8, 8, 8]
stage4_fuse_method: SUM
