# Per-frame single-person pose regression; use xyz, velocity and amplitude, ignoring point tags.
num_joints: 17
num_point_features: 2
xyz_limits:
  - [0.0, 6.0]
  - [-3.0, 3.0]
  - [-2.0, 2.0]
voxel_size:
  - 0.05
  - 0.05
  - 0.1
# Frames are flattened into B*T and encoded independently, so no temporal
# feature is appended inside the single-frame voxelizer.
append_time: false
# Preserve absolute xyz, including height, in features before BEV aggregation.
append_xyz: true

# Sparse 3D backbone size. The current implementation has five channel stages
# and four configurable downsampling kernels; the last two widths must match for fusion.
backbone_channels:
  - 8
  - 16
  - 32
  - 32
  - 32
spconv_kernel_sizes:
  - 3
  - 3
  - 3
  - 3
backbone_out_channel: 64

# One learned query per joint.
head_shared_conv_channel: 64
query_num_heads: 4
query_num_layers: 2
query_ffn_dim: 512
query_dropout: 0.0
