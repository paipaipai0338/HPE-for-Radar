# HoloSense runs/spatial_cross_temporal_parallel/20260427_1523 architecture.
# Adapt only the skeleton to COCO-17; input uses XYZ + radial velocity.
point_in_dim: 4
num_joints: 17
embed_dim: 64
temporal_joint_dim: 12
vel_mask_floor: 0.1
spatial_max_points: 200
spatial_voxel_sizes: [0.1, 0.2, 0.4]
# 低位机绝对坐标的场景范围，与 data.xyz_limits 一致。
spatial_voxel_x_range: [0, 6]
spatial_voxel_y_range: [-3, 3]
spatial_voxel_z_range: [-2, 2]
num_heads: 4
temporal_depth: 2
dropout: 0.2
max_len: 1024
