# 完整 DXYZ + GT bbox 输入 ResNet3D；ROI 重采样、实例分离与坐标还原均在模型内部。
# ROI 尺寸见 models/ResNet3D/model_config.yaml；KXYZ 沿用每隔 2 帧更新、缓存 7 个快照。
experiment:
  description: ResNet3D_DXYZ_KXYZ_GT_ROI
  output_path: /home/pai/Huawei/experiments
data:
  root_path: /mnt/huawei
  packed_data_root: /mnt/ssd/Huawei/
  pointcloud_source: files
  include_kxyz: true  # BIN 多读 13 帧；GT 与输出仍为 T 帧
  base_source: radar_high_bin
  ratio: 0.7
  T: 1  # 每个样本只预测当前帧
  window_stride: 1  # Dataset 内控制窗口起点；每次前进一帧
  acc_frame: 0
  split_method: person
  person_max_points: 200
  max_people: 4
  num_workers: 8
  preload_cache: true
  enable_action: false
  augmentation:
    radar_rotation:
      enabled_train: false
      enabled_val: false
      roll_range_deg:
      - -5.0
      - 5.0
      pitch_range_deg:
      - -2.0
      - 2.0
      yaw_range_deg:
      - -2.0
      - 2.0
    radar_height:
      enabled_train: false
      enabled_val: false
      delta_height_range_m:
      - -0.1
      - 0.1
    point_dropout:
      enabled_train: false
      enabled_val: false
      probability: 0.05
  sensor_config:
    lidar: false
    radar_low_bin: false
    radar_high_bin: true
    radar_low_pc: false
    radar_high_pc: false
    gt: true
    realsense: false
  xyz_limits:
  - - 0.0
    - 6.0
  - - -3.0
    - 3.0
  - - -2.0
    - 2.0
  map_size:
  - 256
  - 256
  cube_size:
  - 64
  - 64
  - 32
  remove_static: false
  angle_bins:
  - 128
  - 32
model:
  name: ResNet3D
  init_checkpoint: null
radar:
  angle_method: bartlett
task:
  coordinate: high
  stage: train
  input: radar_high_bin
  output: gt_for_high
  device: 1
  seed: 42
  batch_size: 4
  precision: BF16
  center_on_pointcloud: false
  center_xy_in_low: false
  train:
    epoch: 200
    init_lr: 0.0003
    warmup_epoch: 0
    resume:
      enabled: true
      checkpoint_path: /home/pai/Huawei/experiments/ResNet3D/20261013_220007/checkpoint/last.pth
      reset_scheduler: true  # 本次从 init_lr 重建剩余轮次调度；再次续训时设为 false。
    metrics:
      Positive_MPJPE: 1
      Pose_Direction: 0
      Time_Smoothness: 0
      Negative_MPJPE: 0
      PAMPJPE: 0
      Bone_Length: 0
      BCE: 0
      bbox_iou: 0
      bbox_l1: 0
      objectness: 0
      rpm2_center_heatmap: 0
      rpm2_center_offset: 0
      rpm2_box_size: 0
      rpm2_pose: 0
      hrradarpose_body_center: 0
      hrradarpose_keypoint_offset: 0
    best_metric: loss
    shuffle: true
  val:
    checkpoint_path: null
    shuffle: false
    score_thresh: 0.1
    iou_thresh: 0.7
    metrics:
      Positive_MPJPE: 1
      Pose_Direction: 0
      Time_Smoothness: 0
      Negative_MPJPE: 0
      PAMPJPE: 0
      Bone_Length: 0
      BCE: 0
      bbox_iou: 0
      bbox_l1: 0
      objectness: 0
      rpm2_center_heatmap: 0
      rpm2_center_offset: 0
      rpm2_box_size: 0
      rpm2_pose: 0
      hrradarpose_body_center: 0
      hrradarpose_keypoint_offset: 0
