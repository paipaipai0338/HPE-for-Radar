experiment:
  description: STPoseTransformer_FFTGen_low
  output_path: /home/orange/Projects/HPE-for-Radar/experiments

data:
    # NAS 地址
    root_path: /mnt/huawei
    # 优先读取 SSD 打包数据；缺失时回退到 root_path
    packed_data_root: /mnt/ssd/Huawei/
    # files: 读取已有点云；skyrelay: BIN -> 动态点 + 六组历史差分微动点
    # Sky 自动读取 T + 6 + acc_frame 帧，生成/积累点云后只保留 T 帧
    pointcloud_source: fftgen
    # 时钟基准
    base_source: radar_high_pc
    # train / total
    ratio: 0.7
    # consist time step
    T: 16
    # 窗口起点每次前进的帧数，训练和验证共用
    window_stride: 1
    # 每帧点云额外拼接同组前 acc_frame 帧，0 表示不积累
    acc_frame: 3
    # 数据划分方式
    split_method: person
    # 单人裁剪后固定点数；不足重复采样，空帧保持零和无效 mask
    person_max_points: 200
    # 每帧估计最大人数
    max_people: 4
    num_workers: 8
    # 仅预加载原始 PC/GT 小文件，SSD 打包帧跳过
    preload_cache: true
    # 是否获取行为标签
    enable_action: false
    augmentation:
        radar_rotation:
            enabled_train: true
            enabled_val: false
            roll_range_deg: [-5.0, 5.0]
            pitch_range_deg: [-2.0, 2.0]
            yaw_range_deg: [-2.0, 2.0]
        radar_height:
            enabled_train: true
            enabled_val: false
            delta_height_range_m: [-0.1, 0.1]
        point_dropout:
            enabled_train: true
            enabled_val: false
            # 固定采样后，每帧每个点独立丢弃的概率
            probability: 0.1
    # 获取数据配置
    sensor_config:
        lidar: false
        radar_low_bin: false
        radar_high_bin: false
        radar_low_pc: false
        radar_high_pc: true
        gt: true
        realsense: false
    # 检测范围
    xyz_limits:
        - [0.0, 6.0]
        - [-3.0, 3.0]
        - [-2.0, 2.0]
    # RPM2 数据处理结果shape
    map_size: [256, 256]
    # HRRadarPose ResNet3D 数据处理结果shape
    cube_size: [96, 96, 32]
    # 仅用于密集谱图模型；Sky 点云使用自身的 meanEn/多帧对消配置
    # BIN 预处理：在频移 FFT/角度谱计算前是否减去 chirp 维复数均值
    remove_static: true
model:
    name: STPoseTransformer
    # 可填 checkpoint 路径，仅加载完全匹配的模型权重；null 不加载，resume 优先
    init_checkpoint: null

radar:
    # 测角方法 [bartlett, mvdr, music]
    angle_method: bartlett

task:
    coordinate: low  # 最终训练坐标系 high / low；使用原始标定，保留增广
    stage: train
    input: radar_high_pc
    output: gt_for_high
    device: 1
    seed: 42
    # BIN 解码和 Sky 处理的 worker 内存开销较大，先用小 batch 建立基线
    batch_size: 128
    # 数值精度: FP32 / FP16 / BF16
    precision: BF16
    # 坐标归一化，仅适配于点云
    center_on_pointcloud: false
    # coordinate: low 下，每人每帧独立中心化 XY，保留 Z
    center_xy_in_low: false
    train:
        epoch: 300
        dense_window_start_epoch: 201  # 前 200 轮步长 T//2，之后步长 1
        init_lr: 0.001
        warmup_epoch: 10
        resume:
          enabled: false
          checkpoint_path: /home/pai/Huawei/experiments/P4Transformer/20261010_235140/checkpoint/last.pth
        metrics:
            # Pose loss
            Positive_MPJPE: 1
            # 三维朝向 1-cosine；FP32 计算
            Pose_Direction: 0
            # 相邻帧平均关节位移平方
            Time_Smoothness: 0
            Negative_MPJPE: 0
            PAMPJPE: 0
            Bone_Length: 0
            BCE: 0
            # Detection loss
            bbox_iou: 0
            bbox_l1: 0
            objectness: 0
            # RPM2 loss
            rpm2_center_heatmap: 0
            rpm2_center_offset: 0
            rpm2_box_size: 0
            rpm2_pose: 0
            # HRRadarPose loss
            hrradarpose_body_center: 0
            hrradarpose_keypoint_offset: 0
        best_metric: loss
        shuffle: true
    val:
        checkpoint_path: /home/pai/Huawei/experiments/P4Transformer/20260909_191752/checkpoint/best.pth
        shuffle: false
        score_thresh: 0.1
        iou_thresh: 0.7
        metrics:
            # Pose loss
            Positive_MPJPE: 1
            Pose_Direction: 0
            Time_Smoothness: 0
            Negative_MPJPE: 0
            PAMPJPE: 0
            Bone_Length: 0
            BCE: 0
            # Detection loss
            bbox_iou : 0
            bbox_l1: 0
            objectness: 0
            # RPM2 loss
            rpm2_center_heatmap: 0
            rpm2_center_offset: 0
            rpm2_box_size: 0
            rpm2_pose: 0
            # HRRadarPose loss
            hrradarpose_body_center: 0
            hrradarpose_keypoint_offset: 0
